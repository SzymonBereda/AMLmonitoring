[project]
name = "amlmon"
version = "0.1.0"
description = "Small rule-based AML transaction monitoring toolkit"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
amlmon = "amlmon.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
